backend:
  name: git-gateway
  branch: main

# Dosyalar verona-site alt klasöründe olduğu için yollar oraya göre
media_folder: "verona-site/resimler"
public_folder: "/resimler"

locale: "tr"

collections:
  - name: "menu"
    label: "Menü"
    files:
      - name: "menu"
        label: "Menü (Kategoriler ve Ürünler)"
        file: "verona-site/menu.json"
        description: "Ürün eklemek, silmek veya fiyat değiştirmek için buradan düzenleyin."
        fields:
          - name: "kategoriler"
            label: "Kategoriler"
            label_singular: "Kategori"
            widget: "list"
            summary: "{{fields.ad}}"
            fields:
              - { name: "ad", label: "Kategori Adı", widget: "string" }
              - { name: "alt_baslik", label: "Alt Başlık (isteğe bağlı)", widget: "string", required: false }
              - { name: "pizza_mi", label: "Pizza kategorisi mi? (3 boy fiyatı)", widget: "boolean", default: false }
              - name: "urunler"
                label: "Ürünler"
                label_singular: "Ürün"
                widget: "list"
                summary: "{{fields.ad}} — {{fields.fiyat}} TL"
                fields:
                  - { name: "ad", label: "Ürün Adı", widget: "string" }
                  - { name: "aciklama", label: "Açıklama / İçindekiler", widget: "text", required: false }
                  - { name: "fiyat", label: "Fiyat (TL) - pizzada KÜÇÜK boy", widget: "string" }
                  - { name: "fiyat_orta", label: "Orta Boy Fiyatı (sadece pizza)", widget: "string", required: false }
                  - { name: "fiyat_buyuk", label: "Büyük Boy Fiyatı (sadece pizza)", widget: "string", required: false }
                  - { name: "gorsel", label: "Ürün Fotoğrafı (isteğe bağlı)", widget: "image", required: false }
                  - { name: "one_cikan", label: "Öne çıkanlarda göster", widget: "boolean", default: false, required: false }
